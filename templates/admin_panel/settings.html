{% extends 'admin_panel/base_admin.html' %}

{% block title %}Restaurant Settings — Savoir Admin{% endblock %}
{% block page_title %}Restaurant Operating Configurations{% endblock %}

{% block content %}

<div class="admin-card" style="max-width:800px;">
  <form method="post">
    {% csrf_token %}

    <div class="admin-card-title" style="margin-bottom:1.5rem;"><i class="fas fa-store" style="color:var(--gold)"></i> General Business Profile</div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
      <div class="form-group">
        <label class="form-label">Restaurant Brand Name</label>
        <input type="text" name="brand_name" class="form-control" value="{{ setting.brand_name }}" required />
      </div>

      <div class="form-group">
        <label class="form-label">Primary Phone Contact</label>
        <input type="text" name="phone" class="form-control" value="{{ setting.phone }}" required />
      </div>

      <div class="form-group">
        <label class="form-label">Contact Email</label>
        <input type="email" name="email" class="form-control" value="{{ setting.email }}" required />
      </div>

      <div class="form-group">
        <label class="form-label">Sales Tax Rate (%)</label>
        <input type="number" step="0.001" name="tax_rate" class="form-control" value="{{ setting.tax_rate }}" required />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Physical Address</label>
      <input type="text" name="address" class="form-control" value="{{ setting.address }}" required />
    </div>

    <div class="form-group">
      <label class="form-label">Hours of Operation</label>
      <input type="text" name="opening_hours" class="form-control" value="{{ setting.opening_hours }}" required />
    </div>

    <button type="submit" class="btn-admin btn-admin-gold">
      <i class="fas fa-save"></i> Save Configuration Settings
    </button>
  </form>
</div>

{% endblock %}
