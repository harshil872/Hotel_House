{% extends 'admin_panel/base_admin.html' %}

{% block title %}Edit Dish #{{ dish.pk }} — Savoir Admin{% endblock %}
{% block page_title %}Edit Dish: {{ dish.name }}{% endblock %}

{% block content %}

<div class="admin-card" style="max-width:850px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
      <div class="form-group">
        <label class="form-label">Dish Name *</label>
        <input type="text" name="name" class="form-control" value="{{ dish.name }}" required />
      </div>

      <div class="form-group">
        <label class="form-label">Category *</label>
        <select name="category" class="form-control" required>
          {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == dish.category.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Price ($ USD) *</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ dish.price }}" required />
      </div>

      <div class="form-group">
        <label class="form-label">Spice Level</label>
        <select name="spice_level" class="form-control">
          <option value="none" {% if dish.spice_level == 'none' %}selected{% endif %}>Not Spicy</option>
          <option value="mild" {% if dish.spice_level == 'mild' %}selected{% endif %}>Mild</option>
          <option value="medium" {% if dish.spice_level == 'medium' %}selected{% endif %}>Medium</option>
          <option value="hot" {% if dish.spice_level == 'hot' %}selected{% endif %}>Hot</option>
          <option value="extra" {% if dish.spice_level == 'extra' %}selected{% endif %}>Extra Hot</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Dish Image File</label>
      {% if dish.image %}
        <div style="margin-bottom:0.5rem;">
          <img src="{{ dish.image.url }}" alt="{{ dish.name }}" style="width:70px; height:70px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--border);" />
        </div>
      {% endif %}
      <input type="file" name="image" accept="image/*" class="form-control" />
    </div>

    <div class="form-group">
      <label class="form-label">Description *</label>
      <textarea name="description" rows="3" class="form-control" required>{{ dish.description }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Key Ingredients (Comma-separated)</label>
      <input type="text" name="ingredients" class="form-control" value="{{ dish.ingredients }}" />
    </div>

    <div class="form-group">
      <label class="form-label">Chef's Pairing Notes</label>
      <textarea name="chef_notes" rows="2" class="form-control">{{ dish.chef_notes }}</textarea>
    </div>

    <div style="display:flex; gap:2rem; margin-bottom:2rem; flex-wrap:wrap;">
      <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
        <input type="checkbox" name="is_vegetarian" {% if dish.is_vegetarian %}checked{% endif %} style="accent-color:var(--gold);" /> Vegetarian
      </label>

      <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
        <input type="checkbox" name="is_gluten_free" {% if dish.is_gluten_free %}checked{% endif %} style="accent-color:var(--gold);" /> Gluten-Free
      </label>

      <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
        <input type="checkbox" name="is_featured" {% if dish.is_featured %}checked{% endif %} style="accent-color:var(--gold);" /> Featured Dish
      </label>

      <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
        <input type="checkbox" name="is_available" {% if dish.is_available %}checked{% endif %} style="accent-color:var(--gold);" /> In Stock / Available
      </label>
    </div>

    <div style="display:flex; gap:1rem;">
      <button type="submit" class="btn-admin btn-admin-gold"><i class="fas fa-save"></i> Save Changes</button>
      <a href="{% url 'admin_menu' %}" class="btn-admin btn-admin-outline">Back to Menu</a>
    </div>

  </form>
</div>

{% endblock %}
